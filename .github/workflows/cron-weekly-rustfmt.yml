name: Nightly rustfmt

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: "0 0 * * 0" # runs weekly on Sunday at 00:00
  workflow_dispatch: # allows manual triggering
jobs:
  format:
    name: Nightly rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install stable and nightly rustfmt
        run: rustup toolchain install stable nightly --profile minimal --component rustfmt
      - name: Run Nightly rustfmt
        # Run nightly to apply the nightly-only options (e.g. import grouping),
        # then stable so the result matches the stable `--check` in CI, and
        # manually remove trailing whitespace.
        run: |
          cargo +nightly fmt --all
          cargo +nightly fmt --manifest-path e2e-tests/Cargo.toml --all
          cargo +stable fmt --all
          cargo +stable fmt --manifest-path e2e-tests/Cargo.toml --all
          git ls-files -- '*.rs' -z | xargs -0 sed -E -i'' -e 's/[[:space:]]+$//'
      - name: Get the current date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          author: Fmt Bot <bot@example.com>
          title: Automated nightly rustfmt (${{ env.date }})
          body: |
           Automated nightly `rustfmt` changes by [create-pull-request](https://github.com/peter-evans/create-pull-request) GitHub action
          commit-message: ${{ env.date }} automated rustfmt nightly 
          labels: rustfmt
